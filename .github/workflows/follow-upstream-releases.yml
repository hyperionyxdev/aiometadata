name: Follow upstream releases

# Keeps the server branch (the code the owner's server runs: upstream's own Live TV, read straight
# from Dispatcharr where the server is set up for it, with recording) on the newest AIOMetadata
# release. Once a day it merges a release that isn't in the branch yet and builds its image under
# the server tag, which the server then pulls. A release that doesn't merge cleanly builds nothing:
# it opens an issue to merge it by hand, and the server keeps the last image.
#
# GitHub runs a schedule only from the repository's default branch, so server is the default.
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: follow-upstream-releases
  cancel-in-progress: false

jobs:
  follow:
    # Only in this fork, never in a copy of it.
    if: github.repository == 'hyperionyxdev/aiometadata'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: cedya77/aiometadata
      BRANCH: server
      TAG_NAME: server
    steps:
      - name: Check out server
        uses: actions/checkout@v4
        with:
          ref: server
          fetch-depth: 0

      - name: Find the newest release
        id: release
        run: |
          tag=$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)
          if [ -z "$tag" ]; then
            echo "The upstream repository listed no release." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Newest upstream release: $tag"

      - name: Merge it into server
        id: merge
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/$TAG"
          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "$TAG is in $BRANCH already; nothing to do."
            echo "result=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub's own no-reply bot identity, for a merge no person made.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git merge --no-edit -m "chore: merge upstream $TAG into $BRANCH" "$TAG"; then
            git push origin "HEAD:$BRANCH"
            echo "result=merged" >> "$GITHUB_OUTPUT"
            echo "Merged $TAG into $BRANCH."
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "$TAG doesn't merge cleanly into $BRANCH." >&2
          fi

      - name: Build the server image
        if: steps.merge.outputs.result == 'merged'
        run: gh workflow run docker-publish-preview.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH" -f tag="$TAG_NAME"

      - name: Ask for the merge to be done by hand
        if: steps.merge.outputs.result == 'conflict'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          title="Release $TAG doesn't merge into $BRANCH cleanly"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -z "$open" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "AIOMetadata $TAG changes code that the Live TV changes on \`$BRANCH\` also change, so it wasn't merged and no image was built. The server keeps running the last \`$TAG_NAME\` image.

          To finish it: merge \`$TAG\` into \`$BRANCH\` by hand, fix the conflicting files, push, then run **Docker - Build and Push PREVIEW Image** on \`$BRANCH\` with the tag \`$TAG_NAME\`. This issue can be closed once that's done; the next daily run carries on from there."
          fi
          exit 1
